<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stopwatch | Om Aditya</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Heading -->
        <h1>STOPWATCH</h1>

        <p class="subtitle">
            SkillCraft Technology — Task 02
        </p>


        <!-- Stopwatch -->
        <div class="stopwatch">

            <div id="display">
                00:00:00.000
            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button id="startBtn">
                    Start
                </button>

                <button id="pauseBtn">
                    Pause
                </button>

                <button id="lapBtn">
                    Lap
                </button>

                <button id="resetBtn">
                    Reset
                </button>

            </div>

        </div>


        <!-- Lap Section -->
        <div class="lap-section">

            <h2>Lap Times</h2>

            <ul id="lapList">
                <!-- Lap times will appear here -->
            </ul>

        </div>


        <!-- Footer -->
        <footer>
            <p>
                Designed & Developed by
                <strong>Om Aditya</strong>
            </p>
        </footer>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
